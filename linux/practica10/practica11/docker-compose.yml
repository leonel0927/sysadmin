services:

  # ── Balanceador / Frontend publico ──────────────────────────
  nginx_lb:
    image: nginx:alpine
    container_name: nginx_lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT}:80"
    networks:
      - red_publica
      - red_datos
    depends_on:
      - app_server
    restart: always

  # ── App server interno (sin puertos al host) ─────────────────
  app_server:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app_server
    networks:
      - red_publica
    restart: always

  # ── Base de datos ────────────────────────────────────────────
  postgres11:
    image: postgres:16-alpine
    container_name: postgres11
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data_p11:/var/lib/postgresql/data
      - ./init_db_p11.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - red_datos
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (solo accesible via tunel SSH) ───────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - red_datos
      - red_admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres11:
        condition: service_healthy
    restart: always

volumes:
  db_data_p11: { name: db_data_p11, driver: local }
  pgadmin_data: { name: pgadmin_data, driver: local }

networks:
  red_admin:
    name: red_admin
    driver: bridge
  red_publica:
    name: red_publica
    driver: bridge
  red_datos:
    name: red_datos
    driver: bridge
    internal: true
